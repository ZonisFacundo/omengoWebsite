<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Esta es la landing de RESTAURANTES (vive en "/"). La de clínicas
      vive en /clinicas/index.html, con su propio título, descripción y
      schema — no reutilizar textos entre las dos, Google puede leerlo
      como contenido duplicado.
      Mantener esta descripción igual a SITE_DESCRIPTION en
      src/config/site.js.
    -->
    <title>Omengo — Atención al cliente por WhatsApp con IA para restaurantes</title>
    <meta
      name="description"
      content="Omengo es un asistente con inteligencia artificial que atiende a tus clientes por WhatsApp las 24 horas: toma pedidos, muestra el menú y precios, resuelve dudas y deriva a una persona cuando hace falta. A medida para tu restaurante."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://omengo.com.ar/" />
    <meta name="theme-color" content="#4e2a85" />

    <!-- Open Graph / Facebook / WhatsApp link preview -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Omengo" />
    <meta property="og:url" content="https://omengo.com.ar/" />
    <meta property="og:title" content="Omengo — Atención al cliente por WhatsApp con IA para restaurantes" />
    <meta
      property="og:description"
      content="Atendé a tus clientes por WhatsApp las 24 horas: pedidos, menú, precios y dudas resueltas al instante, con IA a medida de tu restaurante."
    />
    <!--
      TODO (pendiente de un archivo, no de código): exportar una imagen de
      1200x630px a partir del logo y guardarla en /public/og-image.png.
      No se puede generar una imagen real desde acá — ver README.
    -->
    <meta property="og:image" content="https://omengo.com.ar/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Omengo — Atención al cliente por WhatsApp con IA para restaurantes" />
    <meta
      name="twitter:description"
      content="Atendé a tus clientes por WhatsApp las 24 horas: pedidos, menú, precios y dudas resueltas al instante, con IA a medida de tu restaurante."
    />
    <meta name="twitter:image" content="https://omengo.com.ar/og-image.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <!--
      llms.txt: convención emergente (no un estándar oficial de ningún
      buscador) para que agentes/crawlers de IA encuentren un resumen
      claro del sitio. Es de bajo costo y no tiene contras, así que se
      incluye igual. Ver /public/llms.txt.
    -->
    <link rel="llms-txt" href="/llms.txt" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org: identidad de la empresa (Omengo es un proveedor de
         software/servicio, no un local físico al que el cliente final
         visita — por eso se usa Organization + Service en vez de
         LocalBusiness). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Omengo",
        "url": "https://omengo.com.ar/",
        "logo": "https://omengo.com.ar/logo-omengo.png",
        "description": "Omengo es un asistente con inteligencia artificial que atiende por WhatsApp a los clientes de negocios en Argentina, con implementaciones a medida para restaurantes y para clínicas y centros de salud.",
        "areaServed": { "@type": "Country", "name": "Argentina" },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "telephone": "+54-9-11-7828-1132",
          "areaServed": "AR",
          "availableLanguage": ["Spanish"]
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Service",
        "serviceType": "Asistente de atención al cliente por WhatsApp con inteligencia artificial",
        "provider": { "@type": "Organization", "name": "Omengo" },
        "areaServed": { "@type": "Country", "name": "Argentina" },
        "audience": { "@type": "BusinessAudience", "audienceType": "Restaurantes" },
        "description": "Toma pedidos, responde consultas de menú y precios, y deriva a un vendedor humano cuando hace falta. Se configura a medida para cada restaurante."
      }
    </script>

    <!--
      Google Analytics 4: todavía no hay una cuenta creada (ver README).
      Cuando la tengan, reemplazar G-XXXXXXXXXX acá abajo por el ID real
      y descomentar estas dos etiquetas <script>.
    -->
    <!--
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
    -->
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
